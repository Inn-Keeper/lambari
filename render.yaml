# Render Blueprint for the API: New → Blueprint → pick this repo.
# The free plan sleeps after 15 min without traffic, and in-memory state
# (cases, velocity windows) resets when it does.
services:
  - type: web
    name: lambari-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Demo limits keep memory inside the free plan's 512 MB.
      - key: LAMBARI_SIM_MAX_RATE
        value: "1000"
      - key: LAMBARI_SIM_MAX_DURATION
        value: 10m
      - key: LAMBARI_DISABLE_INGEST
        value: "true"
      # Your Vercel URL(s), comma-separated, e.g. https://lambari.vercel.app.
      # Asked for when the Blueprint is created.
      - key: LAMBARI_ALLOWED_ORIGINS
        sync: false
